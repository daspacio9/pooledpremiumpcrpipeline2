name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, linting]

permissions:
  pull-requests: read
  contents: read
  statuses: write

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@latest
        with:
          fetch-depth: 0
      - name: Formatting
        uses: super-linter/super-linter@latest
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_YAML_PRETTIER: true

  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@latest
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@latest
        with:
          directory: .
          snakefile: workflow/Snakefile
          args: "--lint"

  Testing:
    runs-on: ubuntu-latest
    needs:
      - Linting
      - Formatting
    steps:
      - uses: actions/checkout@latest

      - name: Test workflow
        uses: snakemake/snakemake-github-action@latest
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--sdm conda --show-failed-logs --cores 2 --conda-cleanup-pkgs cache --all-temp"

      - name: Test report
        uses: snakemake/snakemake-github-action@latest
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--report report.zip"
